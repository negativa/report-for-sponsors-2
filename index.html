<script id="contentData" type="application/json">{"stories":[{"id":1,"category":"faith","season":"summer","title":{"uk":"Літній табір у Підгайному та хрещення","sk":"Letný tábor v Pidhajnom a krst","cs":"Letní tábor v Pidhajnem a křest","en":"Summer camp in Pidhaine and baptism"},"lead":{"uk":"Найважливіший момент табору — рішення Дарини й Дані прийняти хрещення.","sk":"Najvzácnejšou chvíľou tábora bol krst Dariny a Daniho.","cs":"Nejcennějším okamžikem tábora byl křest Daryny a Daniho.","en":"The most meaningful moment of camp was Daryna and Dania’s baptism."},"paras":[{"uk":"Разом із командою друзів зі Словаччини ми провели літній табір у селі Підгайне. Це був час зустрічей, спілкування, біблійних уроків і спільної радості.","sk":"Spolu s tímom priateľov zo Slovenska sme v obci Pidhajne zorganizovali letný tábor. Bol to čas stretnutí, rozhovorov, biblických lekcií a radosti.","cs":"Společně s týmem přátel ze Slovenska jsme v obci Pidhajne uspořádali letní tábor. Byl to čas setkání, rozhovorů, biblických lekcí a radosti.","en":"Together with a team of friends from Slovakia, we held a summer camp in the village of Pidhaine—a time of fellowship, Bible lessons and joy."},{"uk":"Особливим благословенням для нашої команди стало хрещення двох молодих служителів — Дарини та Дані. Ми раділи, бачачи, як Бог діє в їхніх серцях і як вони свідомо роблять важливий крок віри.","sk":"Mimoriadnym požehnaním pre náš tím bol krst dvoch mladých služobníkov, Dariny a Daniho. S radosťou sme sledovali, ako Boh pôsobí v ich srdciach a ako vedome urobili dôležitý krok viery.","cs":"Zvláštním požehnáním pro náš tým byl křest dvou mladých služebníků, Daryny a Daniho. S radostí jsme viděli, jak Bůh působí v jejich srdcích a jak vědomě udělali důležitý krok víry.","en":"It was a special blessing for our team to witness two young ministry volunteers, Daryna and Dania, being baptized. We rejoiced to see God at work in their hearts as they took this important step of faith."},{"uk":"Для нас плоди служіння — це не лише проведені заходи, а й люди, які духовно зростають і самі починають служити іншим.","sk":"Ovocím služby nie sú pre nás len uskutočnené podujatia, ale najmä ľudia, ktorí duchovne rastú a sami začínajú slúžiť druhým.","cs":"Ovocem služby pro nás nejsou jen uskutečněné akce, ale především lidé, kteří duchovně rostou a sami začínají sloužit druhým.","en":"For us, the fruit of ministry is not only the events we organize, but the people who grow spiritually and begin serving others."}],"images":["1000019558","1000019556","1000019557","1000009346","1000009079"],"groups":[],"quote":{"uk":"Найбільша радість — бачити, як Бог діє в серцях молодих людей.","sk":"Najväčšou radosťou je vidieť, ako Boh koná v srdciach mladých ľudí.","cs":"Největší radostí je vidět, jak Bůh působí v srdcích mladých lidí.","en":"Our greatest joy is seeing God at work in young people’s hearts."}},{"id":2,"category":"rebuild","season":"summer","title":{"uk":"Поки тривав табір — тривала й відбудова","sk":"Popri tábore pokračovala aj obnova domov","cs":"Vedle tábora pokračovala i obnova domovů","en":"Rebuilding continued alongside the camp"},"lead":{"uk":"Практична допомога родинам у Підгайному йшла поруч із дитячим служінням.","sk":"Praktická pomoc rodinám v Pidhajnom prebiehala súbežne so službou deťom.","cs":"Praktická pomoc rodinám v Pidhajnem probíhala souběžně se službou dětem.","en":"Practical help for families in Pidhaine continued alongside our work with children."},"paras":[{"uk":"Поки одні проводили літній табір, інші разом із волонтерами продовжували будівельні роботи. Ми допомагаємо людям відновлювати не тільки житло, а й відчуття дому та надію на майбутнє.","sk":"Kým jedna časť tímu pripravovala letný tábor, ďalší dobrovoľníci pokračovali v stavebných prácach. Pomáhame ľuďom obnovovať nielen domy, ale aj pocit domova a nádej do budúcnosti.","cs":"Zatímco část týmu vedla letní tábor, další dobrovolníci pokračovali ve stavebních pracích. Pomáháme lidem obnovovat nejen domy, ale i pocit domova a naději do budoucna.","en":"While part of the team ran camp activities, other volunteers continued construction. We want to help people recover not only a house, but a sense of home and hope for the future."},{"uk":"Влітку працювали над покрівлею будинку Марії, а також будували й утеплювали гараж Дениса. У спільній праці брала участь і молодь.","sk":"V lete sme pracovali na streche Máriinho domu a tiež na stavbe a zatepľovaní Denisovej garáže. Do spoločnej práce sa zapojili aj mladí ľudia.","cs":"V létě jsme pracovali na střeše Mariina domu a také na stavbě a zateplování Denisovy garáže. Do práce se zapojili i mladí lidé.","en":"During the summer we worked on Maria’s roof and on building and insulating Denys’s garage. Young volunteers joined the work too."}],"images":[],"groups":[{"name":{"uk":"Покрівля будинку Марії","sk":"Strecha Máriinho domu","cs":"Střecha Mariina domu","en":"Maria’s roof"},"photos":["1000009436"]},{"name":{"uk":"Гараж Дениса: покрівля та утеплення","sk":"Denisova garáž: strecha a izolácia","cs":"Denysova garáž: střecha a zateplení","en":"Denys’s garage: roofing and insulation"},"photos":["1000009593","1000009569"]}],"quote":null},{"id":3,"category":"faith","season":"summer","title":{"uk":"30 років церкві «Джерело Надії»","sk":"30 rokov cirkvi „Prameň nádeje“","cs":"30 let sboru „Pramen naděje“","en":"30 years of the Source of Hope church"},"lead":{"uk":"Божа вірність, маленька громада й 19 років мого власного духовного шляху.","sk":"Božia vernosť, malý zbor a 19 rokov mojej vlastnej duchovnej cesty.","cs":"Boží věrnost, malé společenství a 19 let mé vlastní duchovní cesty.","en":"God’s faithfulness, a small congregation, and 19 years of my own spiritual journey."},"paras":[{"uk":"Цього літа ми відсвяткували 30-річчя нашої церкви «Джерело Надії». На ювілей приїхали місіонери зі США, які стояли біля її витоків. Навіть через три десятиліття вони продовжують піклуватися про громаду й підтримувати наші служіння.","sk":"Toto leto sme oslávili 30. výročie nášho zboru „Prameň nádeje“. Prišli aj misionári z USA, ktorí stáli pri jeho vzniku. Aj po troch desaťročiach sa o zbor starajú a podporujú našu službu.","cs":"Letos v létě jsme oslavili 30. výročí našeho sboru „Pramen naděje“. Přijeli také misionáři z USA, kteří stáli u jeho zrodu. I po třech desetiletích o sbor pečují a podporují naši službu.","en":"This summer we celebrated the 30th anniversary of our Source of Hope church. Missionaries from the United States who helped establish the church came to celebrate. Three decades later, they still care for the congregation and support our ministries."},{"uk":"Я є частиною цієї церкви вже 19 років. Бог привів мене сюди через мою кохану дружину. Були й складні часи, коли я думав піти до іншої церкви. Та Бог поклав мені на серце залишитися, служити й підтримувати громаду. Сьогодні я щасливий, що залишився.","sk":"Som súčasťou tohto zboru už 19 rokov. Boh ma sem priviedol prostredníctvom mojej milovanej manželky. Boli aj ťažké chvíle, keď som uvažoval o odchode. Boh mi však položil na srdce zostať, slúžiť a podporovať spoločenstvo. Dnes som vďačný, že som zostal.","cs":"Jsem součástí tohoto sboru už 19 let. Bůh mě sem přivedl prostřednictvím mé milované ženy. Byly i těžké chvíle, kdy jsem uvažoval o odchodu. Bůh mi však položil na srdce zůstat, sloužit a podporovat společenství. Dnes jsem vděčný, že jsem zůstal.","en":"I have belonged to this church for 19 years. God brought me here through my beloved wife. There were difficult seasons when I considered leaving for another church. But I felt God calling me to stay, serve, and stand with the congregation. Today I am grateful I stayed."},{"uk":"Наша церква маленька. Через це ми близькі одне до одного — і водночас маємо вчитися терпінню, прощенню та взаємному прийняттю. Серед нашої недосконалості Бог продовжує виявляти Свою благодать.","sk":"Náš zbor je malý. Sme si preto blízki, ale zároveň sa učíme trpezlivosti, odpusteniu a vzájomnému prijatiu. Uprostred našej nedokonalosti Boh stále prejavuje svoju milosť.","cs":"Náš sbor je malý. Jsme si proto blízcí, ale zároveň se učíme trpělivosti, odpuštění a vzájemnému přijetí. Uprostřed naší nedokonalosti Bůh stále projevuje svou milost.","en":"Our church is small. That brings us close, but also teaches us patience, forgiveness and acceptance. In the midst of our imperfections, God continues to show His grace."}],"images":["1000008101","1000008316","1000008036"],"groups":[],"quote":{"uk":"Дякую Богові за неймовірні 19 років у цій духовній родині.","sk":"Ďakujem Bohu za neuveriteľných 19 rokov v tejto duchovnej rodine.","cs":"Děkuji Bohu za neuvěřitelných 19 let v této duchovní rodině.","en":"I thank God for 19 remarkable years in this spiritual family."}},{"id":4,"category":"family","season":"summer","title":{"uk":"Білий Dodge — подарунок спільної підтримки","sk":"Biely Dodge — dar spoločnej podpory","cs":"Bílý Dodge — dar společné podpory","en":"A white Dodge, made possible together"},"lead":{"uk":"Друзі з чотирьох країн допомогли нам придбати автомобіль для служіння та сім’ї.","sk":"Priatelia zo štyroch krajín nám pomohli kúpiť auto pre službu i rodinu.","cs":"Přátelé ze čtyř zemí nám pomohli pořídit auto pro službu i rodinu.","en":"Friends from four countries helped us buy a vehicle for ministry and family life."},"paras":[{"uk":"Після літнього табору сталася ще одна дуже радісна подія: ми змогли придбати білий Dodge Grand Caravan. Це не новий автомобіль із салону, але він значно новіший за ті, якими ми користувалися раніше.","sk":"Po letnom tábore prišla ďalšia radostná udalosť: podarilo sa nám kúpiť biely Dodge Grand Caravan. Nie je úplne nový, ale je výrazne novší než autá, ktoré sme mali predtým.","cs":"Po letním táboře přišla další radostná událost: podařilo se nám koupit bílý Dodge Grand Caravan. Není úplně nový, ale je výrazně novější než auta, která jsme měli dříve.","en":"After summer camp, we experienced another joyful moment: we were able to buy a white Dodge Grand Caravan. It is not brand-new, but it is much newer than the vehicles we had before."},{"uk":"Це стало можливим завдяки друзям зі США, Словаччини, Чехії та України. Ми неймовірно вдячні кожному, хто пожертвував, молився й допомагав.","sk":"Umožnili to priatelia z USA, Slovenska, Česka a Ukrajiny. Sme nesmierne vďační každému, kto prispel, modlil sa a pomáhal.","cs":"Umožnili to přátelé z USA, Slovenska, Česka a Ukrajiny. Jsme nesmírně vděční každému, kdo přispěl, modlil se a pomáhal.","en":"Friends in the United States, Slovakia, Czechia and Ukraine made this possible. We are deeply grateful to everyone who gave, prayed and helped."},{"uk":"Машина потрібна нам для поїздок у Підгайне, зустрічей із людьми, перевезення речей та щоденних сімейних потреб. Завдяки їй ми також змогли вирушити у довгоочікувану сімейну відпустку.","sk":"Auto nám pomáha cestovať do Pidhajného, navštevovať ľudí, prevážať potrebné veci a starať sa o rodinu. Umožnilo nám aj dlho očakávanú rodinnú dovolenku.","cs":"Auto nám pomáhá cestovat do Pidhajného, navštěvovat lidi, převážet potřebné věci i pečovat o rodinu. Umožnilo nám také dlouho očekávanou rodinnou dovolenou.","en":"The vehicle helps us travel to Pidhaine, visit people, carry supplies and meet our family’s everyday needs. It also made a long-awaited family holiday possible."}],"images":["1000009984","1000017775","1000010058"],"groups":[],"quote":{"uk":"Дякуємо, що ваша підтримка допомагає нам служити людям і піклуватися про сім’ю.","sk":"Ďakujeme, že vaša podpora nám pomáha slúžiť ľuďom a starať sa o rodinu.","cs":"Děkujeme, že nám vaše podpora pomáhá sloužit lidem a pečovat o rodinu.","en":"Thank you for helping us serve others while caring for our family."}},{"id":5,"category":"community","season":"ongoing","title":{"uk":"Між великими подіями — повсякденне життя в Підгайному","sk":"Medzi veľkými udalosťami — každodenný život v Pidhajnom","cs":"Mezi velkými událostmi — každodenní život v Pidhajnem","en":"Between big events: everyday life in Pidhaine"},"lead":{"uk":"Служіння триває не лише на таборах чи будівельних майданчиках.","sk":"Služba pokračuje aj mimo táborov a stavenísk.","cs":"Služba pokračuje i mimo táborů a stavenišť.","en":"Ministry continues beyond camps and building sites."},"paras":[{"uk":"Між таборами, волонтерськими приїздами та будівельними проєктами ми знову й знову їдемо у Підгайне. Бог дає можливості будувати стосунки з місцевою молоддю, родинами, яким ми допомагаємо, та іншими жителями села.","sk":"Medzi tábormi, dobrovoľníckymi návštevami a stavebnými projektmi sa stále vraciame do Pidhajného. Boh nám dáva príležitosti budovať vzťahy s miestnou mládežou, rodinami, ktorým pomáhame, a ďalšími obyvateľmi.","cs":"Mezi tábory, návštěvami dobrovolníků a stavebními projekty se stále vracíme do Pidhajného. Bůh nám dává příležitosti budovat vztahy s místní mládeží, rodinami, kterým pomáháme, a dalšími obyvateli.","en":"Between camps, volunteer visits and construction projects, we keep returning to Pidhaine. God gives us opportunities to build relationships with local young people, the families we help, and other villagers."},{"uk":"Іноді це спільна праця. Інколи — обід, прогулянка, зустріч із молоддю чи проста розмова. Ми хочемо не лише приїжджати з програмою, а бути поруч із людьми в їхньому звичайному житті.","sk":"Niekedy je to spoločná práca, inokedy obed, prechádzka či obyčajný rozhovor. Nechceme prichádzať len s programom — chceme byť ľuďom nablízku v každodennom živote.","cs":"Někdy jde o společnou práci, jindy o oběd, procházku nebo obyčejný rozhovor. Nechceme přicházet jen s programem — chceme být lidem nablízku v každodenním životě.","en":"Sometimes it is shared work; other times it is lunch, a walk or a simple conversation. We want to be more than visitors with a program. We want to be present in people’s everyday lives."},{"uk":"Віримо, що Божа любов проявляється й у таких невеликих, але справжніх зустрічах.","sk":"Veríme, že Božia láska sa prejavuje aj v takýchto malých, no skutočných stretnutiach.","cs":"Věříme, že Boží láska se projevuje i v takových malých, ale opravdových setkáních.","en":"We believe God’s love is also revealed in these small but genuine encounters."}],"images":["1000009410","1000007797","1000007793","1000007561"],"groups":[],"quote":null},{"id":6,"category":"family","season":"summer","title":{"uk":"Словаччина та Чехія: відпочинок, сім’я і друзі","sk":"Slovensko a Česko: oddych, rodina a priatelia","cs":"Slovensko a Česko: odpočinek, rodina a přátelé","en":"Slovakia and Czechia: rest, family and friends"},"lead":{"uk":"Іноді найцінніший подарунок — кілька ночей без вибухів і повітряних тривог.","sk":"Niekedy je najväčším darom niekoľko nocí bez výbuchov a leteckých poplachov.","cs":"Někdy je největším darem několik nocí bez výbuchů a leteckých poplachů.","en":"Sometimes the greatest gift is a few nights without explosions or air-raid alerts."},"paras":[{"uk":"На новішому Dodge ми змогли всією сім’єю поїхати до Словаччини. Наші дорогі друзі Петя та Дана прийняли нас у своєму затишному відреставрованому дерев’яному будиночку в красивому гірському селі. Перші кілька днів ми просто відсипалися: без вибухів, без тривог, без необхідності прислухатися до кожного звуку.","sk":"S novším Dodge sme sa mohli s celou rodinou vydať na Slovensko. Naši drahí priatelia Peťa a Dana nás privítali v útulnej zrekonštruovanej drevenici v krásnej horskej dedinke. Prvé dni sme jednoducho dospávali — bez výbuchov, poplachov a potreby načúvať každému zvuku.","cs":"S novějším Dodgem jsme mohli s celou rodinou vyrazit na Slovensko. Naši drazí přátelé Peťa a Dana nás přijali v útulné zrekonstruované roubené chaloupce v krásné horské vesnici. První dny jsme prostě dospávali — bez výbuchů, poplachů a nutnosti naslouchat každému zvuku.","en":"With our newer Dodge, we were able to travel as a family to Slovakia. Our dear friends Peťa and Dana welcomed us into their cozy renovated wooden cottage in a beautiful mountain village. For the first few days, we simply slept—without explosions, alerts or the need to listen for every sound."},{"uk":"Потім були гори, неймовірні краєвиди й багато часу разом. Найважливіше — ми могли бути татом і мамою для дітей, чоловіком і дружиною одне для одного. Не поспішати до наступного завдання. Просто бути сім’єю.","sk":"Potom prišli hory, nádherné výhľady a veľa spoločného času. Najdôležitejšie bolo, že sme mohli byť rodičmi pre naše deti a manželmi jeden pre druhého. Neponáhľať sa za ďalšou úlohou. Jednoducho byť rodinou.","cs":"Pak přišly hory, nádherné výhledy a spousta společného času. Nejdůležitější bylo, že jsme mohli být rodiči pro naše děti a manžely jeden pro druhého. Nespěchat za dalším úkolem. Prostě být rodinou.","en":"Then came mountains, beautiful views and precious time together. Most importantly, we could be mom and dad to our children and husband and wife to each other—not rushing toward the next task, just being a family."},{"uk":"Ми також ближче познайомилися з друзями, з якими служимо в Україні. Крісті познайомила нас зі своєю сім’єю. Особливо мене вразив музей старовинних родинних речей, який створив її тато. Друзі вперше навчили мене збирати гриби — так почалося моє нове захоплення.","sk":"Lepšie sme spoznali aj priateľov, s ktorými slúžime na Ukrajine. Kristi nás predstavila svojej rodine. Veľmi ma zaujal malý múzejný priestor, ktorý jej otec vytvoril zo starých rodinných predmetov. Priatelia ma prvýkrát naučili zbierať huby — a začala sa moja nová záľuba.","cs":"Lépe jsme poznali také přátele, s nimiž sloužíme na Ukrajině. Kristi nás představila své rodině. Velmi mě zaujal malý muzejní prostor, který její tatínek vytvořil ze starých rodinných předmětů. Přátelé mě poprvé naučili sbírat houby — a začal můj nový koníček.","en":"We also got to know friends we serve alongside in Ukraine on a more personal level. Kristi introduced us to her family. Her father’s small museum of objects used by earlier generations deeply impressed me. Our friends also taught me to gather mushrooms for the first time—and a new hobby began."},{"uk":"Ми побували й у Чехії: зустріли дорогих чеських друзів, які багато вклали в нашу сім’ю, та українських друзів, які через війну вимушені жити за кордоном. Ця відпустка подарувала відновлені сили, нові спогади й ще глибшу вдячність за людей, яких Бог послав у наше життя.","sk":"Navštívili sme aj Česko. Stretli sme drahých českých priateľov, ktorí našej rodine veľmi pomohli, aj ukrajinských priateľov, ktorí kvôli vojne musia žiť v zahraničí. Dovolenka nám priniesla obnovu síl, krásne spomienky a ešte väčšiu vďačnosť za ľudí, ktorých Boh priviedol do nášho života.","cs":"Navštívili jsme také Česko. Setkali jsme se s drahými českými přáteli, kteří naší rodině hodně pomohli, i s ukrajinskými přáteli, kteří kvůli válce musí žít v zahraničí. Dovolená nám přinesla obnovu sil, krásné vzpomínky a ještě větší vděčnost za lidi, které Bůh přivedl do našeho života.","en":"We also visited Czechia, reuniting with dear Czech friends who have invested so much in our family, and Ukrainian friends who must remain abroad because of the war. We returned with renewed strength, beautiful memories and deeper gratitude for the people God has placed in our lives."}],"images":["1000010282","1000010280","1000010274","1000012583","1000010884","1000010953","1000010816","1000010516","1000010986","1000011009","1000012943","1000010301","1000010261","1000012110","1000012114","1000012129","1000011745","1000013366","1000013371","1000013317"],"groups":[],"quote":{"uk":"Перші кілька днів ми просто спали. Без вибухів. Без повітряних тривог. Просто жили.","sk":"Prvé dni sme iba spali. Bez výbuchov. Bez poplachov. Jednoducho sme žili.","cs":"První dny jsme jen spali. Bez výbuchů. Bez poplachů. Prostě jsme žili.","en":"For the first few days, we simply slept. No explosions. No alerts. Just living."}},{"id":7,"category":"community","season":"ongoing","title":{"uk":"Українська та словацька молодь: дружба, що долає кордони","sk":"Ukrajinská a slovenská mládež: priateľstvo cez hranice","cs":"Ukrajinská a slovenská mládež: přátelství přes hranice","en":"Ukrainian and Slovak youth: friendship across borders"},"lead":{"uk":"Команди приїжджають разом працювати, а роз’їжджаються справжніми друзями.","sk":"Tímy prichádzajú spolu pracovať a odchádzajú ako skutoční priatelia.","cs":"Týmy přijíždějí společně pracovat a odjíždějí jako opravdoví přátelé.","en":"Teams come to work together and leave as real friends."},"paras":[{"uk":"За час спільних таборів і будівельних проєктів наша молодь дуже здружилася зі словацькою командою. Кожного приїзду вони чекають не тільки заради служіння, але й заради зустрічі з друзями.","sk":"Počas spoločných táborov a stavebných projektov si naša mládež vytvorila silné priateľstvá so slovenským tímom. Na každú návštevu sa tešia nielen kvôli službe, ale aj kvôli priateľom.","cs":"Během společných táborů a stavebních projektů si naše mládež vytvořila silná přátelství se slovenským týmem. Na každou návštěvu se těší nejen kvůli službě, ale i kvůli přátelům.","en":"Through camps and building projects, our young volunteers have formed close friendships with the Slovak team. They look forward to every visit—not only to serve, but to see their friends."},{"uk":"Вже стала традицією остання прогулянка Києвом перед від’їздом словаків і спільні проводи на залізничний вокзал. Там усі ще довго розмовляють, сміються, обіймаються — і ніяк не хочуть прощатися.","sk":"Tradíciou sa stala posledná prechádzka Kyjevom pred odchodom Slovákov a spoločné odprevádzanie na železničnú stanicu. Tam sa ešte dlho rozprávajú, smejú, objímajú a nechcú sa rozlúčiť.","cs":"Tradicí se stala poslední procházka Kyjevem před odjezdem Slováků a společné loučení na nádraží. Tam si ještě dlouho povídají, smějí se, objímají a nechtějí se rozloučit.","en":"A final walk through Kyiv and a farewell at the railway station have become a tradition. They keep talking, laughing and hugging—never quite ready to say goodbye."},{"uk":"Ми будували будинки та організовували табори, а Бог тим часом будував щось не менш цінне — довіру, християнську єдність і дружбу, яка переживає відстані.","sk":"Stavali sme domy a organizovali tábory, ale Boh medzičasom budoval niečo rovnako cenné — dôveru, kresťanskú jednotu a priateľstvo, ktoré prekonáva vzdialenosti.","cs":"Stavěli jsme domy a organizovali tábory, ale Bůh mezitím budoval něco stejně cenného — důvěru, křesťanskou jednotu a přátelství, které překonává vzdálenosti.","en":"We were building houses and organizing camps, while God was building something equally valuable: trust, Christian unity and friendship that outlasts distance."}],"images":["1000019002","1000009736","1000009813","1000009789","1000019026"],"groups":[],"quote":{"uk":"Ми разом будуємо не лише будинки — ми будуємо дружбу.","sk":"Spoločne nestaviame len domy — budujeme priateľstvo.","cs":"Společně nestavíme jen domy — budujeme přátelství.","en":"Together, we are building more than houses. We are building friendships."}},{"id":8,"category":"rebuild","season":"oct","title":{"uk":"Жовтнева команда: будинки стають ближчими до завершення","sk":"Októbrový tím: domy sú bližšie k dokončeniu","cs":"Říjnový tým: domy jsou blíž dokončení","en":"October team: homes closer to completion"},"lead":{"uk":"Словацькі друзі знову приїхали, щоб власноруч допомагати українським родинам.","sk":"Slovenskí priatelia opäť prišli osobne pomáhať ukrajinským rodinám.","cs":"Slovenští přátelé opět přijeli osobně pomáhat ukrajinským rodinám.","en":"Our Slovak friends returned to help Ukrainian families with their own hands."},"paras":[{"uk":"У жовтні словацька команда знову приїхала до нас для будівельних і ремонтних робіт. Ми продовжили одразу кілька проєктів — різних за станом, але однаково важливих для родин.","sk":"V októbri k nám slovenský tím opäť prišiel na stavebné a rekonštrukčné práce. Pokračovali sme na viacerých projektoch v rôznych fázach dokončenia.","cs":"V říjnu k nám slovenský tým znovu přijel na stavební a opravné práce. Pokračovali jsme na několika projektech v různých fázích dokončení.","en":"In October our Slovak friends returned for another round of building and renovation. We continued work on several projects, each at a different stage but equally important to the families involved."},{"uk":"Ми дуже вдячні всім, хто жертвує час, ресурси й власні сили, щоб допомогти людям жити в теплі, безпеці й наближатися до повернення додому.","sk":"Sme veľmi vďační všetkým, ktorí venujú čas, prostriedky a svoje sily, aby ľuďom pomohli žiť v teple a bezpečí a priblížili návrat domov.","cs":"Jsme velmi vděční všem, kdo věnují čas, prostředky a vlastní síly, aby lidem pomohli žít v teple a bezpečí a přiblížili návrat domů.","en":"We are deeply grateful to everyone who gives their time, resources and energy so families can live in warmth and safety and move closer to being home."}],"images":[],"groups":[{"name":{"uk":"Денис: теплий будинок перед зимою","sk":"Denis: teplejší dom pred zimou","cs":"Denys: teplejší dům před zimou","en":"Denys: a warmer home for winter"},"desc":{"uk":"Денис із родиною вже живе в цьому будинку. Ми утеплили зовнішні стіни й продовжили фасадні штукатурні роботи, щоб зменшити тепловтрати та ризик утворення вологи й плісняви.","sk":"Denis s rodinou už v dome býva. Zatepľovali sme vonkajšie steny a pokračovali vo fasádnych omietkach, aby sme znížili tepelné straty a riziko vlhkosti či plesní.","cs":"Denys s rodinou už v domě bydlí. Zateplovali jsme vnější stěny a pokračovali ve fasádních omítkách, aby se snížily tepelné ztráty a riziko vlhkosti a plísní.","en":"Denys and his family already live in this house. We insulated the exterior walls and continued façade plastering to reduce heat loss and the risk of dampness and mold."},"photos":["1000018694","1000018479","1000018690","1000018872","1000018892"]},{"name":{"uk":"Марія: електрика, утеплення, тераса","sk":"Mária: elektroinštalácia, izolácia, terasa","cs":"Maria: elektřina, zateplení, terasa","en":"Maria: wiring, insulation and terrace"},"desc":{"uk":"У будинку Марії виконали розведення електропроводки, продовжили утеплення внутрішніх конструкцій даху та стін, розпочали дерев’яне облицювання тераси.","sk":"V Máriinom dome sme rozviedli elektroinštaláciu, pokračovali v izolácii strechy a stien a začali drevené obloženie terasy.","cs":"V Mariině domě jsme rozvedli elektroinstalaci, pokračovali v zateplení střechy a stěn a začali dřevěné obložení terasy.","en":"At Maria’s house, electrical wiring was installed, insulation of roof and wall structures continued, and wooden cladding for the terrace began."},"photos":["1000018698","1000018781","1000018455","1000018858"]},{"name":{"uk":"Сергій: будинок уже майже готовий","sk":"Serhij: dom je takmer hotový","cs":"Serhij: dům je téměř hotový","en":"Serhii: almost ready to move in"},"desc":{"uk":"У будинку Сергія вже змонтовано гіпсокартон, укладено плитку на підлозі, працюють над системами опалення та водопостачання. Наступний крок — придбання й монтаж сантехніки, щоб наблизити довгоочікуваний переїзд родини.","sk":"V Serhijovom dome je namontovaný sadrokartón, položená dlažba a pripravené rozvody kúrenia a vody. Ďalším krokom je nákup a montáž sanitárneho vybavenia, aby sa rodina mohla čoskoro nasťahovať.","cs":"V Serhijově domě jsou hotové sádrokartony, položená dlažba a rozvody topení a vody. Dalším krokem je nákup a montáž sanitárního vybavení, aby se rodina mohla brzy nastěhovat.","en":"At Serhii’s house, drywall and floor tiles are in place, and the heating and water-supply systems have been installed. The next step is purchasing and fitting bathroom fixtures, bringing the family closer to moving in."},"photos":["1000009187","1000009183","1000009184"]}],"quote":null},{"id":9,"category":"solidarity","season":"autumn","title":{"uk":"Старий Dodge — нова місія для захисників","sk":"Starý Dodge — nové poslanie pre obrancov","cs":"Starý Dodge — nové poslání pro obránce","en":"Our older Dodge: a new mission"},"lead":{"uk":"Коли нам допомогли придбати інше авто, попереднє отримало можливість служити військовим.","sk":"Keď nám pomohli kúpiť iné auto, to pôvodné mohlo začať slúžiť vojakom.","cs":"Když nám pomohli koupit jiné auto, to původní mohlo začít sloužit vojákům.","en":"When friends helped us obtain a newer vehicle, our old one could help Ukrainian defenders."},"paras":[{"uk":"Цієї осені я передав наш старенький Dodge Grand Caravan українським військовим. Автомобіль багато років допомагав нашій родині; тепер він потрібен людям, які захищають Україну.","sk":"Túto jeseň som odovzdal náš starší Dodge Grand Caravan ukrajinským vojakom. Dlhé roky slúžil našej rodine; teraz môže pomáhať ľuďom, ktorí bránia Ukrajinu.","cs":"Letos na podzim jsem předal náš starší Dodge Grand Caravan ukrajinským vojákům. Dlouhá léta sloužil naší rodině; nyní může pomáhat lidem, kteří brání Ukrajinu.","en":"This autumn I passed our older Dodge Grand Caravan on to Ukrainian servicemen. It had served our family for many years; now it can help those who defend Ukraine."},{"uk":"Перед передачею машина потребувала ремонту. Багато українців долучилися коштами, щоб її підготувати. Тепер вона служить на передовій, і я сподіваюся, що її просторий салон буде корисним хлопцям у щоденних завданнях.","sk":"Pred odovzdaním bolo potrebné auto opraviť. Mnohí Ukrajinci finančne prispeli na prípravu. Teraz slúži pri frontovej línii a dúfam, že jeho priestranný interiér bude chlapcom užitočný.","cs":"Před předáním bylo třeba auto opravit. Mnoho Ukrajinců finančně přispělo na přípravu. Nyní slouží poblíž fronty a doufám, že jeho prostorný interiér bude chlapcům užitečný.","en":"The car needed repairs before handover. Many Ukrainians contributed financially to prepare it. It now serves near the front, and I hope its spacious interior will be useful in the soldiers’ daily work."},{"uk":"Для мене це історія про те, як отримана допомога може стати допомогою іншим. Дякую кожному, хто долучився, і молюся про збереження наших захисників.","sk":"Pre mňa je to príbeh o tom, ako sa prijatá pomoc môže zmeniť na pomoc druhým. Ďakujem každému, kto prispel, a modlím sa za ochranu našich obrancov.","cs":"Pro mě je to příběh o tom, jak se přijatá pomoc může proměnit v pomoc druhým. Děkuji každému, kdo přispěl, a modlím se za ochranu našich obránců.","en":"To me, this is a story of how help received can become help given. Thank you to everyone who contributed. I pray for the safety of our defenders."}],"images":["1000018265","1000018267"],"groups":[],"quote":{"uk":"Одна допомога породжує іншу.","sk":"Jedna pomoc plodí ďalšiu.","cs":"Jedna pomoc rodí další.","en":"One act of generosity makes another possible."}},{"id":10,"category":"life","season":"autumn","title":{"uk":"Українські ліси: гриби поруч зі слідами війни","sk":"Ukrajinské lesy: huby popri stopách vojny","cs":"Ukrajinské lesy: houby vedle stop války","en":"Ukrainian forests: mushrooms and traces of war"},"lead":{"uk":"Навіть у лісі, куди йдеш за тишею, війна нагадує про себе.","sk":"Aj v lese, kam človek ide za tichom, sa pripomína vojna.","cs":"I v lese, kam člověk jde za tichem, se připomíná válka.","en":"Even in the forest, where we seek quiet, war leaves its mark."},"paras":[{"uk":"Після того як друзі у Словаччині навчили мене збирати гриби, я продовжив це захоплення вдома. Наші ліси прекрасні й багаті на гриби, а прогулянки серед дерев дарують хвилини спокою.","sk":"Keď ma priatelia na Slovensku naučili zbierať huby, pokračoval som v tomto koníčku aj doma. Naše lesy sú krásne a bohaté na huby a prechádzky medzi stromami prinášajú chvíle pokoja.","cs":"Když mě přátelé na Slovensku naučili sbírat houby, pokračoval jsem v tomto koníčku i doma. Naše lesy jsou krásné a bohaté na houby a procházky mezi stromy přinášejí chvíle klidu.","en":"After friends in Slovakia taught me to gather mushrooms, I continued this new hobby back home. Our forests are beautiful and full of mushrooms, and walking among the trees offers moments of peace."},{"uk":"Та іноді серед моху й гілок трапляються уламки ракет і безпілотників — нагадування про обстріли та роботу протиповітряної оборони. Контраст разючий: ще хвилину тому ти радів грибам, а тепер бачиш сліди війни.","sk":"Niekedy však medzi machom a konármi nachádzame úlomky rakiet a dronov — pripomienku útokov a protivzdušnej obrany. Je to silný kontrast: chvíľu sa tešíš z húb a vzápätí vidíš stopy vojny.","cs":"Někdy však mezi mechem a větvemi nacházíme úlomky raket a dronů — připomínku útoků a protivzdušné obrany. Je to silný kontrast: chvíli se raduješ z hub a vzápětí vidíš stopy války.","en":"But sometimes among the moss and branches are fragments of missiles and drones—a reminder of attacks and air defence. The contrast is striking: one moment you are delighted by mushrooms, the next you see the traces of war."},{"uk":"Ми продовжуємо жити, виховувати дітей, служити й радіти простим речам. І молимося про день, коли українські ліси знову будуть безпечними для всіх.","sk":"Žijeme ďalej, vychovávame deti, slúžime a tešíme sa z jednoduchých vecí. Modlíme sa za deň, keď budú ukrajinské lesy opäť bezpečné pre všetkých.","cs":"Žijeme dál, vychováváme děti, sloužíme a radujeme se z jednoduchých věcí. Modlíme se za den, kdy budou ukrajinské lesy opět bezpečné pro všechny.","en":"We keep living, raising children, serving and finding joy in simple things. And we pray for the day when Ukrainian forests will be safe for everyone again."}],"images":["1000016992","1000017518","1000018198","1000017923"],"groups":[],"quote":{"uk":"Навіть там, де шукаємо тиші, війна нагадує про себе.","sk":"Aj tam, kde hľadáme ticho, nám vojna pripomína svoju prítomnosť.","cs":"I tam, kde hledáme ticho, nám válka připomíná svou přítomnost.","en":"Even where we seek silence, war reminds us it is still here."}},{"id":11,"category":"family","season":"autumn","title":{"uk":"Довгоочікуване досягнення Тані — диплом із християнського консультування","sk":"Táňin dlho očakávaný úspech — diplom z kresťanského poradenstva","cs":"Táňin dlouho očekávaný úspěch — diplom z křesťanského poradenství","en":"Tanya’s long-awaited achievement — a diploma in Christian counseling"},"lead":{"uk":"Цієї осені моя дружина Таня отримала диплом бакалавра з християнського консультування — мета, до якої вона йшла роками.","sk":"Túto jeseň moja manželka Táňa získala bakalársky diplom v odbore kresťanské poradenstvo — cieľ, za ktorým išla celé roky.","cs":"Letos na podzim moje žena Táňa získala bakalářský diplom v oboru křesťanské poradenství — cíl, za kterým šla mnoho let.","en":"This autumn my wife Tanya received her bachelor’s diploma in Christian counseling, a goal she had been working toward for years."},"paras":[{"uk":"Цієї осені в нашій родині була ще одна дуже радісна подія. Моя дружина Таня отримала диплом бакалавра з християнського консультування. Для неї це не просто документ чи завершення навчальної програми — це довгоочікуваний результат багаторічної праці.","sk":"Túto jeseň sme v našej rodine prežili ďalšiu radostnú udalosť. Moja manželka Táňa získala bakalársky diplom v odbore kresťanské poradenstvo. Nie je to pre ňu iba dokument či ukončenie štúdia, ale dlho očakávaný výsledok mnohých rokov úsilia.","cs":"Letos na podzim jsme v naší rodině prožili další radostnou událost. Moje žena Táňa získala bakalářský diplom v oboru křesťanské poradenství. Není to pro ni jen dokument nebo završení studia, ale dlouho očekávaný výsledek mnohaletého úsilí.","en":"This autumn brought another joyful moment for our family. My wife Tanya received her bachelor’s diploma in Christian counseling. For her, it is more than a certificate or the end of a program: it is the long-awaited result of years of hard work."},{"uk":"Я знаю, скільки часу, наполегливості й терпіння стоїть за цим досягненням. Тому особливо радію за Таню і вдячний Богові, що вона змогла пройти цей довгий шлях до кінця.","sk":"Viem, koľko času, vytrvalosti a trpezlivosti sa za týmto úspechom skrýva. O to viac sa z Táne teším a ďakujem Bohu, že dokázala prejsť celou touto dlhou cestou.","cs":"Vím, kolik času, vytrvalosti a trpělivosti se za tímto úspěchem skrývá. O to větší radost z Táni mám a děkuji Bohu, že dokázala dojít až do konce této dlouhé cesty.","en":"I know how much time, perseverance and patience went into this achievement. I am deeply happy for Tanya and grateful to God that she was able to see this long journey through."},{"uk":"Сподіваюся, що здобуті знання й досвід допомагатимуть їй ще глибше розуміти людей, підтримувати тих, хто проходить через труднощі, та служити їм із мудрістю і любов’ю. Для всієї нашої сім’ї це особливий привід для вдячності й радості.","sk":"Dúfam, že získané vedomosti a skúsenosti jej pomôžu ešte hlbšie rozumieť ľuďom, podporovať tých, ktorí prechádzajú ťažkosťami, a slúžiť im s múdrosťou a láskou. Pre celú našu rodinu je to vzácny dôvod na vďačnosť a radosť.","cs":"Doufám, že získané znalosti a zkušenosti jí pomohou ještě hlouběji rozumět lidem, podporovat ty, kteří procházejí těžkostmi, a sloužit jim s moudrostí a láskou. Pro celou naši rodinu je to krásný důvod k vděčnosti a radosti.","en":"My hope is that what she has learned will help her understand people more deeply, support those going through difficult times, and serve with wisdom and love. For our whole family, this is a special reason for gratitude and joy."}],"images":["1000019634","1000019633"],"groups":[],"quote":{"uk":"Це не лише диплом — це роки наполегливості, які принесли свій плід.","sk":"Nie je to len diplom — sú to roky vytrvalosti, ktoré priniesli svoje ovocie.","cs":"Není to jen diplom — jsou to roky vytrvalosti, které přinesly své ovoce.","en":"More than a diploma, this is the fruit of years of perseverance."}}],"ui":{"uk":{"lang":"Українська","brand":"Живі історії","report":"МІСІОНЕРСЬКИЙ ЗВІТ","period":"ЧЕРВЕНЬ — ЖОВТЕНЬ 2026","heroTitle":"Бог продовжує свою працю.","heroSub":"Історії віри, відбудови, дружби та Божої турботи — п’ять місяців служіння й життя в Україні.","heroKicker":"Підгайне · Україна · друзі по всьому світу","read":"Читати історії","introKicker":"ДОРОГІ ДРУЗІ ТА ПАРТНЕРИ","introTitle":"Дякуємо, що йдете поруч із нами.","intro":"Це не лише перелік заходів чи виконаних робіт. Це люди, стосунки, кроки віри, тепліші домівки й маленькі радощі серед складного часу. Ми хочемо поділитися тим, що Бог робив у нашому житті та служінні протягом останніх п’яти місяців.","stories":"Наші історії","storiesSub":"Від літнього табору до осінньої праці та сімейних моментів.","all":"Усі історії","faith":"Віра і церква","rebuild":"Відбудова","community":"Дружба","family":"Сім’я","solidarity":"Допомога","life":"Життя під час війни","summer":"Літо 2026","autumn":"Осінь 2026","oct":"Жовтень 2026","ongoing":"Літо — осінь 2026","more":"Показати всі фото","less":"Згорнути галерею","photos":"Світлини","finalKicker":"З ВДЯЧНІСТЮ","finalTitle":"Це можливо завдяки вам.","finalText":"Дякуємо кожному, хто молиться, приїжджає, працює, допомагає фінансово, підтримує словом і залишається поруч. Ваш внесок стає частиною реальних історій людей.","footer":"З любов’ю та вдячністю — сім’я Павлових і друзі по служінню.","top":"Нагору","photoCount":"фото","stat1":"хрещення молодих служителів","stat2":"будинки, де тривала відбудова","stat3":"років церкві «Джерело Надії»","stat4":"країни підтримали придбання авто","safety":"Фото військових та людей слід публікувати за їхньою згодою.","close":"Закрити фото","next":"Наступне фото","prev":"Попереднє фото"},"sk":{"lang":"Slovenčina","brand":"Živé príbehy","report":"SPRÁVA Z MISIJNEJ SLUŽBY","period":"JÚN — OKTÓBER 2026","heroTitle":"Boh pokračuje vo svojom diele.","heroSub":"Príbehy viery, obnovy domov, priateľstva a Božej starostlivosti — päť mesiacov služby a života na Ukrajine.","heroKicker":"Pidhajne · Ukrajina · priatelia po celom svete","read":"Prečítať príbehy","introKicker":"MILÍ PRIATELIA A PARTNERI","introTitle":"Ďakujeme, že kráčate s nami.","intro":"Nie je to len zoznam podujatí a dokončených prác. Sú to ľudia, vzťahy, kroky viery, teplejšie domovy a malé radosti uprostred náročného obdobia. Chceme sa podeliť o to, čo Boh robil v našom živote a službe počas posledných piatich mesiacov.","stories":"Naše príbehy","storiesSub":"Od letného tábora cez jesenné práce až po rodinné chvíle.","all":"Všetky príbehy","faith":"Viera a cirkev","rebuild":"Obnova domov","community":"Priateľstvo","family":"Rodina","solidarity":"Pomoc","life":"Život počas vojny","summer":"Leto 2026","autumn":"Jeseň 2026","oct":"Október 2026","ongoing":"Leto — jeseň 2026","more":"Zobraziť všetky fotky","less":"Zbaliť galériu","photos":"Fotografie","finalKicker":"S VĎAČNOSŤOU","finalTitle":"Je to možné aj vďaka vám.","finalText":"Ďakujeme každému, kto sa modlí, prichádza, pracuje, finančne pomáha, povzbudzuje a zostáva pri nás. Váš príspevok sa stáva súčasťou skutočných ľudských príbehov.","footer":"S láskou a vďačnosťou — rodina Pavlovcov a priatelia v službe.","top":"Hore","photoCount":"fotiek","stat1":"krsty mladých služobníkov","stat2":"domy, na ktorých sme pracovali","stat3":"rokov zboru „Prameň nádeje“","stat4":"krajiny podporili kúpu auta","safety":"Pred zverejnením je potrebný súhlas osôb na fotografiách.","close":"Zavrieť fotografiu","next":"Ďalšia fotografia","prev":"Predchádzajúca fotografia"},"cs":{"lang":"Čeština","brand":"Živé příběhy","report":"ZPRÁVA O MISIJNÍ SLUŽBĚ","period":"ČERVEN — ŘÍJEN 2026","heroTitle":"Bůh pokračuje ve svém díle.","heroSub":"Příběhy víry, obnovy domovů, přátelství a Boží péče — pět měsíců služby a života na Ukrajině.","heroKicker":"Pidhajne · Ukrajina · přátelé po celém světě","read":"Číst příběhy","introKicker":"MILÍ PŘÁTELÉ A PARTNEŘI","introTitle":"Děkujeme, že jdete s námi.","intro":"Není to jen seznam akcí a hotových prací. Jsou to lidé, vztahy, kroky víry, teplejší domovy a malé radosti uprostřed těžkého období. Chceme se podělit o to, co Bůh dělal v našem životě a službě během posledních pěti měsíců.","stories":"Naše příběhy","storiesSub":"Od letního tábora přes podzimní práci až po rodinné chvíle.","all":"Všechny příběhy","faith":"Víra a církev","rebuild":"Obnova domovů","community":"Přátelství","family":"Rodina","solidarity":"Pomoc","life":"Život za války","summer":"Léto 2026","autumn":"Podzim 2026","oct":"Říjen 2026","ongoing":"Léto — podzim 2026","more":"Zobrazit všechny fotky","less":"Sbalit galerii","photos":"Fotografie","finalKicker":"S VDĚČNOSTÍ","finalTitle":"Je to možné i díky vám.","finalText":"Děkujeme každému, kdo se modlí, přijíždí, pracuje, finančně pomáhá, povzbuzuje a zůstává s námi. Vaše podpora se stává součástí skutečných lidských příběhů.","footer":"S láskou a vděčností — rodina Pavlových a přátelé ve službě.","top":"Nahoru","photoCount":"fotek","stat1":"křty mladých služebníků","stat2":"domy, na nichž probíhaly práce","stat3":"let sboru „Pramen naděje“","stat4":"země podpořily koupi auta","safety":"Před zveřejněním je třeba souhlas osob na fotografiích.","close":"Zavřít fotografii","next":"Další fotografie","prev":"Předchozí fotografie"},"en":{"lang":"English","brand":"Stories of Hope","report":"MISSION & LIFE UPDATE","period":"JUNE — OCTOBER 2026","heroTitle":"God is still at work.","heroSub":"Stories of faith, rebuilding, friendship and God’s care—five months of ministry and life in Ukraine.","heroKicker":"Pidhaine · Ukraine · friends around the world","read":"Explore the stories","introKicker":"DEAR FRIENDS AND PARTNERS","introTitle":"Thank you for walking with us.","intro":"This is more than a list of events or finished projects. It is about people, relationships, steps of faith, warmer homes and small joys in a difficult season. We want to share what God has been doing in our lives and ministry over the past five months.","stories":"Our stories","storiesSub":"From summer camp to autumn work and precious family moments.","all":"All stories","faith":"Faith & church","rebuild":"Rebuilding","community":"Friendship","family":"Family","solidarity":"Practical help","life":"Life during war","summer":"Summer 2026","autumn":"Autumn 2026","oct":"October 2026","ongoing":"Summer — autumn 2026","more":"Show all photos","less":"Collapse gallery","photos":"Photo stories","finalKicker":"WITH GRATITUDE","finalTitle":"You make this possible.","finalText":"Thank you to everyone who prays, visits, works, gives financially, encourages us, and stays close. Your generosity becomes part of real stories in people’s lives.","footer":"With love and gratitude — the Pavlov family and our ministry friends.","top":"Back to top","photoCount":"photos","stat1":"young volunteers baptized","stat2":"homes with rebuilding work","stat3":"years of the Source of Hope church","stat4":"countries supported the vehicle","safety":"Please confirm consent before publishing photos of soldiers or other people.","close":"Close photo","next":"Next photo","prev":"Previous photo"}},"extra":{"uk":{"brand":"Сімʼя Павлових","heading":"Події за останні п’ять місяців","period":"Червень — жовтень 2026 року","strap":"Лист про нашу сім’ю, служіння, Божу вірність та людей, які йдуть поруч із нами.","introLabel":"Дорогі друзі","introHeading":"Дякуємо за вашу підтримку","introOne":"Перш за все щиро дякуємо вам за постійну підтримку нашої сім’ї та служіння. Через вашу щедрість, дружбу та молитви ми відчуваємо Божу турботу й можемо бути поруч із тими, хто потребує допомоги.","introTwo":"Ці п’ять місяців були наповнені таборами, відбудовою житла, дорогоцінними зустрічами й сімейними подіями. Хочемо розповісти про них просто й особисто — як друзям.","photos":"Переглянути фото","imageTitle":"Фотографії цієї історії","clickToSee":"Натисніть на фото, щоб переглянути галерею","prayerLabel":"Молитовні потреби","prayerH":"Про що просимо молитися","prayers":["За Дарину, Даню та інших молодих служителів — щоб їхня віра зростала.","За родини Марії, Дениса та Сергія, завершення будівництва й необхідні матеріали.","За захист людей в Україні та військових, які боронять нашу країну.","За сили продовжувати служіння і не опускати руки, бо часом просто хочеться зупинитися і забути про те, що треба кудись їхати й комусь допомагати.","За більше часу разом як сім’ї — для близькості, відпочинку й простих спільних моментів.","Продовжуйте, будь ласка, молитися за всиновлення дитини. Ми вже зібрали майже всі необхідні документи. Для мене особисто це теж крок віри: я трохи побоююся появи ще однієї дитини в сім’ї, навіть попри те, що з нами вже живуть двоє дітей наших друзів."],"nextLabel":"Що попереду","nextH":"Продовжуємо рухатися вперед","nextText":"Нас чекають нові зустрічі з людьми, продовження ремонту будинків та служіння дітям і молоді. Особливо важливо завершити сантехнічні роботи в будинку Сергія, щоб наблизити переїзд родини.","thanksLabel":"Подяка","thanksH":"Дякуємо, що ви поруч","thanks1":"Ми дуже вдячні кожному з вас за молитви, підтримку та щире серце. Через вас Бог допомагає нам служити людям, відбудовувати домівки, підтримувати молодь та знаходити сили рухатися далі.","thanks2":"Нехай Господь благословить ваші сім’ї та ваші церкви. Дякуємо, що залишаєтеся частиною нашого життя й служіння.","sign":"З любов’ю та вдячністю, сім’я Павлових","footer":"Сімʼя Павлових · Місіонерський звіт · Літо — осінь 2026","previous":"Попередній звіт: березень — травень 2026","tagline":"СЛУЖІННЯ · СІМ’Я · ДРУЖБА","close":"Закрити","next":"Наступне фото","prev":"Попереднє фото","theme":"Змінити тему","image":"Відкрити фото"},"en":{"brand":"The Pavlov Family","heading":"The past five months","period":"June — October 2026","strap":"A letter about our family, ministry, God’s faithfulness, and the people walking alongside us.","introLabel":"Dear friends","introHeading":"Thank you for your support","introOne":"First of all, we want to thank you for your steady support of our family and ministry. Through your generosity, friendship, and prayers, we experience God’s care and can stand alongside people who need help.","introTwo":"These five months have brought camps, home rebuilding, precious friendships, and family moments. We want to share these stories personally — as with friends.","photos":"View photos","imageTitle":"Photos from this story","clickToSee":"Click a photo to explore the gallery","prayerLabel":"Prayer requests","prayerH":"Please pray with us","prayers":["For Daryna, Dania and other young volunteers as they grow in faith.","For the families of Mariia, Denys and Serhii, and for resources to complete their homes.","For the protection of people in Ukraine and those defending our country.","For strength to keep serving and not lose heart, because at times we simply want to stop and forget that we need to travel somewhere and help someone.","For more time together as a family—for closeness, rest, and simple shared moments.","Please continue to pray for the adoption of a child. We have already gathered almost all the necessary documents. For me personally, this is also a step of faith: I feel some fear about welcoming one more child into our family, even though two children of our friends are already living with us."],"nextLabel":"Looking forward","nextH":"The work continues","nextText":"We continue visiting families, rebuilding homes, and working with children and young people. One urgent next step is completing the plumbing in Serhii’s house so that his family can move closer to moving in.","thanksLabel":"With gratitude","thanksH":"Thank you for standing with us","thanks1":"We are truly grateful for your prayers, support and kindness. Through you, God helps us serve people, rebuild homes, encourage young people and find strength to keep going.","thanks2":"May the Lord bless your families and churches. Thank you for remaining part of our lives and ministry.","sign":"With love and gratitude, the Pavlov family","footer":"The Pavlov family · Mission update · Summer — autumn 2026","previous":"Previous report: March — May 2026","tagline":"MINISTRY · FAMILY · FRIENDSHIP","close":"Close","next":"Next photo","prev":"Previous photo","theme":"Change color theme","image":"Open photo"},"sk":{"brand":"Rodina Pavlovovcov","heading":"Udalosti za posledných päť mesiacov","period":"Jún — október 2026","strap":"List o našej rodine, službe, Božej vernosti a ľuďoch, ktorí stoja pri nás.","introLabel":"Milí priatelia","introHeading":"Ďakujeme za vašu podporu","introOne":"V prvom rade vám zo srdca ďakujeme za stálu podporu našej rodiny a služby. Vďaka vašej štedrosti, priateľstvu a modlitbám cítime Božiu starostlivosť a môžeme stáť pri ľuďoch, ktorí potrebujú pomoc.","introTwo":"Týchto päť mesiacov prinieslo tábory, obnovu domov, vzácne stretnutia aj rodinné chvíle. Radi by sme sa o tieto príbehy podelili osobne — ako s priateľmi.","photos":"Pozrieť fotografie","imageTitle":"Fotografie z tohto príbehu","clickToSee":"Kliknite na fotografiu a zobrazte galériu","prayerLabel":"Modlitebné potreby","prayerH":"Za čo prosíme o modlitby","prayers":["Za Darynu, Daňu a ďalších mladých služobníkov, aby rástli vo viere.","Za rodiny Márie, Denysa a Serhija a za prostriedky na dokončenie ich domovov.","Za ochranu ľudí na Ukrajine a tých, ktorí bránia našu krajinu.","Za silu pokračovať v službe a nestrácať odvahu, pretože niekedy máme chuť jednoducho sa zastaviť a zabudnúť na to, že treba niekam ísť a niekomu pomôcť.","Za viac času spolu ako rodina — na blízkosť, oddych a obyčajné spoločné chvíle.","Prosím, pokračujte v modlitbách za adopciu dieťaťa. Už sme zhromaždili takmer všetky potrebné dokumenty. Pre mňa osobne je to tiež krok viery: mám trochu obavy z toho, že do rodiny pribudne ďalšie dieťa, aj keď s nami už žijú dve deti našich priateľov."],"nextLabel":"Čo je pred nami","nextH":"Pokračujeme ďalej","nextText":"Pokračujeme v návštevách rodín, obnove domov a službe deťom a mládeži. Dôležitým ďalším krokom je dokončenie sanitárnych prác v Serhijovom dome, aby sa jeho rodina mohla čoskoro nasťahovať.","thanksLabel":"Vďačnosť","thanksH":"Ďakujeme, že stojíte pri nás","thanks1":"Sme nesmierne vďační za vaše modlitby, podporu a láskavosť. Prostrední ho, že do rodiny přibude další dítě, i když s námi už žijí dvě děti našich přátel."],"nextLabel":"Co je před námi","nextH":"Pokračujeme dál","nextText":"Pokračujeme v návštěvách rodin, obnově domovů a službě dětem a mladým lidem. Důležitým dalším krokem je dokončení instalatérských prací v Serhijově domě, aby se jeho rodina mohla brzy nastěhovat.","thanksLabel":"Vděčnost","thanksH":"Děkujeme, že stojíte při nás","thanks1":"Jsme nesmírně vděční za vaše modlitby, podporu a laskavost. Skrze vás nám Bůh pomáhá sloužit lidem, obnovovat domovy, povzbuzovat mladé a nacházet sílu pokračovat.","thanks2":"Ať Pán žehná vašim rodinám a sborům. Děkujeme, že zůstáváte součástí našeho života a služby.","sign":"S láskou a vděčností, rodina Pavlovových","footer":"Rodina Pavlovových · Misijní zpráva · Léto — podzim 2026","previous":"Předchozí zpráva: březen — květen 2026","tagline":"SLUŽBA · RODINA · PŘÁTELSTVÍ","close":"Zavřít","next":"Další fotografie","prev":"Předchozí fotografie","theme":"Změnit barevný motiv","image":"Otevřít fotografii"}}}</script>
